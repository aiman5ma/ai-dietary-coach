<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <meta
      name="description"
      content="المدرب الغذائي الذكي — حلّل التغذية، واحسب مؤشر كتلة الجسم، وامسح صور الطعام، وتحدّث مع المدربة نوفا."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=DM+Sans:wght@400;500&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>المدرب الغذائي الذكي</title>
    <script>
      (function () {
        try {
          var lang = localStorage.getItem("dietary_language");
          if (lang !== "en" && lang !== "ar") lang = "ar";
          var root = document.documentElement;
          root.lang = lang;
          root.dir = lang === "ar" ? "rtl" : "ltr";
          document.title = lang === "ar" ? "المدرب الغذائي الذكي" : "AI Dietary Coach";
          if (localStorage.getItem("dietary_theme") === "dark") {
            root.classList.add("dark");
            var themeMeta = document.querySelector('meta[name="theme-color"]');
            if (themeMeta) themeMeta.setAttribute("content", "#0d1117");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
